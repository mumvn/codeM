<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Home Asset Accountability Platform</title><link rel='stylesheet' href='/styles.css'></head><body>
<h1>Home Asset Accountability Platform (MVP)</h1>
<div class='card'>Login: <input id='email' value='owner@example.com'> <input id='password' type='password' value='password'><button id='login'>Login</button></div>
<div class='grid'>
<div class='card'><h3>Dashboard</h3><pre id='dash'></pre></div>
<div class='card'><h3>Create Property</h3><input id='pname' placeholder='name'><button id='addProperty'>Add</button></div>
<div class='card'><h3>Create Issue</h3><input id='ititle' placeholder='title'><button id='addIssue'>Add</button></div>
<div class='card'><h3>Upload Document (mock)</h3><input id='dname' placeholder='doc'><button id='addDoc'>Upload</button></div>
<div class='card'><h3>Add Cost</h3><input id='camt' placeholder='amount'><button id='addCost'>Add</button></div>
</div>
<script src='/app.js'></script></body></html>
