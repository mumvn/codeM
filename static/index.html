<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NIST CSF 2.0 Control Explorer</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<div class="app">
  <header>
    <h1>NIST CSF 2.0 Control Explorer</h1>
    <div id="profile"></div>
    <button id="logoutBtn" hidden>Logout</button>
  </header>

  <section id="loginCard" class="card">
    <h2>Login</h2>
    <p>Try: alice / ravi / priya / ops1 (password: <code>password123</code>)</p>
    <input id="username" placeholder="username" />
    <input id="password" type="password" placeholder="password" />
    <button id="loginBtn">Sign in</button>
    <p id="loginErr" class="error"></p>
  </section>

  <section id="main" hidden>
    <div class="layout">
      <aside class="card" id="sidebar">
        <h3>Functions & Categories</h3>
        <div id="tree"></div>
      </aside>
      <main class="card">
        <div class="toolbar">
          <input id="search" placeholder="Search control code or statement" />
          <select id="sortBy"><option value="code">Sort: Code</option><option value="statement">Sort: Statement</option></select>
          <select id="sortDir"><option value="asc">Asc</option><option value="desc">Desc</option></select>
        </div>
        <table>
          <thead><tr><th>Control</th><th>Statement</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pager">
          <button id="prev">Prev</button>
          <span id="pageMeta"></span>
          <button id="next">Next</button>
        </div>
      </main>
    </div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
